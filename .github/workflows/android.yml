name: Android-App

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BEER_VERSION_CODE: ${{ github.run_number }}
      BEER_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Web-App zusammenstellen und ins Android-Projekt kopieren
        run: |
          node scripts/build-web.mjs "${GITHUB_SHA::8}"
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Release-Schlüssel aus Secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p ../dist
          cp app/build/outputs/apk/$BUILD_TYPE/*.apk ../dist/beer-tracker.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: beer-tracker-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: dist/beer-tracker.apk

  # Auf dem Standard-Branch: APK als Release „android-latest“ veröffentlichen (fester Download-Link)
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: beer-tracker-*
          merge-multiple: true
          path: dist
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/beer-tracker.apk \
            --target "$GITHUB_SHA" \
            --title "Android-App (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::8}. APK auf dem Handy öffnen und installieren – Updates einfach über die bestehende App installieren." \
            --latest
